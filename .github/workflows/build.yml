name: Build and Push O2Physics Builder Image

# ── Triggers ────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - alice-system-deps.repo
      - nersc/setup.sh
      - nersc/build_o2physics.sh
      - .github/workflows/build.yml

  workflow_dispatch:

  # Rebuild monthly to pick up OS/system package updates.
  # (O2Physics itself is built on NERSC $SCRATCH, not here.)
  schedule:
    - cron: "0 2 1 * *"   # 1st of every month at 02:00 UTC

# ── Job ─────────────────────────────────────────────────────
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # This image is just AlmaLinux 9 + system packages + aliBuild.
    # No heavy compilation: should finish in ~10-15 minutes.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate date tag
        id: date
        run: echo "tag=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/o2physics-builder:${{ steps.date.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/o2physics-builder:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/o2physics-builder:buildcache
          cache-to:   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/o2physics-builder:buildcache,mode=max
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/o2physics-builder:${{ steps.date.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/o2physics-builder:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next: pull on NERSC with \`shifterimg pull docker:${{ secrets.DOCKERHUB_USERNAME }}/o2physics-builder:latest\`" >> $GITHUB_STEP_SUMMARY
